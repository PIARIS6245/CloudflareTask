<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mini Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#111112;--sf:#1c1c1e;--card:#2c2c2e;--bdr:#3a3a3c;
  --tx:#f5f5f7;--mu:#8e8e93;--ac:#ff9500;--gr:#30d158;--rd:#ff453a;
  --nh:58px;color-scheme:dark;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#f2f2f7;--sf:#fff;--card:#fff;--bdr:#c6c6c8;--tx:#000;color-scheme:light
  }
}
:root[data-theme=dark]{
  --bg:#111112;--sf:#1c1c1e;--card:#2c2c2e;--bdr:#3a3a3c;--tx:#f5f5f7;color-scheme:dark
}

body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;
  min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);
}

nav{
  position:sticky;top:0;z-index:10;
  display:flex;background:var(--sf);border-bottom:1px solid var(--bdr);
  padding-top:env(safe-area-inset-top,0px);
}
.tb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;background:none;border:none;color:var(--mu);
  font-size:10px;cursor:pointer;transition:color .15s;
}
.tb .ico{font-size:22px;line-height:1}
.tb.on{color:var(--ac)}

.pn{display:none;padding:20px 16px}
.pn.on{display:block}

/* CLOCK */
#pn-clock{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;min-height:calc(100dvh - var(--nh));padding:0;
}
#pn-clock.on{display:flex}
.clk-t{font-size:76px;font-weight:100;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.clk-d{margin-top:12px;font-size:18px;color:var(--mu)}
.clk-w{margin-top:5px;font-size:14px;color:var(--mu)}

/* CALCULATOR */
.cs{background:var(--card);border-radius:14px;padding:14px 16px;text-align:right;margin-bottom:10px}
.cs-ex{font-size:13px;color:var(--mu);min-height:18px}
.cs-v{font-size:44px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cb{
  padding:20px 0;border:none;border-radius:14px;font-size:20px;
  cursor:pointer;background:var(--card);color:var(--tx);transition:transform .08s;
}
.cb:active{transform:scale(.93)}
.cb.fn{background:var(--bdr)}
.cb.op,.cb.eq{background:var(--ac);color:#000;font-size:24px}
.cb.w2{grid-column:span 2;padding-left:28px;text-align:left}

/* TODO */
.td-row{display:flex;gap:8px;margin-bottom:14px}
.td-in{
  flex:1;padding:13px 14px;background:var(--card);border:none;
  border-radius:12px;color:var(--tx);font-size:15px;outline:none;
}
.td-in::placeholder{color:var(--mu)}
.td-add{padding:13px 18px;background:var(--ac);color:#000;border:none;border-radius:12px;font-size:22px;cursor:pointer}
.td-ul{list-style:none}
.td-li{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;background:var(--card);border-radius:12px;margin-bottom:7px;
}
.td-li.dn .td-tx{text-decoration:line-through;color:var(--mu)}
.td-ck{
  width:24px;height:24px;border:2px solid var(--bdr);border-radius:50%;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .15s;
}
.td-li.dn .td-ck{background:var(--gr);border-color:var(--gr);color:#fff}
.td-tx{flex:1;font-size:15px;cursor:pointer}
.td-dl{background:none;border:none;color:var(--rd);font-size:18px;cursor:pointer;padding:4px}

/* CONVERTER */
.cv-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.cv-ttl{font-size:12px;color:var(--mu);margin-bottom:10px}
.cv-row{display:flex;align-items:center;gap:8px}
.cv-inp{
  flex:1;padding:10px 12px;background:var(--sf);border:1px solid var(--bdr);
  border-radius:10px;color:var(--tx);font-size:17px;outline:none;text-align:right;
}
.cv-unit{font-size:14px;color:var(--mu);width:30px}
.cv-arr{font-size:20px;color:var(--ac)}

/* TIMER */
.tm-wr{text-align:center;padding:28px 0 24px}
.tm-t{font-size:68px;font-weight:100;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.tm-t.dn{color:var(--rd)}
.tm-ins{display:flex;justify-content:center;gap:12px;margin:20px 0}
.tm-grp{display:flex;flex-direction:column;align-items:center;gap:5px}
.tm-lb{font-size:12px;color:var(--mu)}
.tm-ip{
  width:72px;padding:10px;background:var(--card);border:none;
  border-radius:10px;color:var(--tx);font-size:24px;text-align:center;outline:none;
}
.tm-ct{display:flex;gap:10px;justify-content:center}
.tm-btn{
  padding:14px 32px;border:none;border-radius:14px;
  font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s;
}
.tm-btn:active{transform:scale(.95)}
.tm-go{background:var(--gr);color:#fff}
.tm-pa{background:var(--ac);color:#000}
.tm-rs{background:var(--card);color:var(--tx)}
</style>
</head>
<body>

<nav>
  <button class="tb on" onclick="go('clock',this)"><span class="ico">🕐</span>時計</button>
  <button class="tb" onclick="go('calc',this)"><span class="ico">🧮</span>電卓</button>
  <button class="tb" onclick="go('todo',this)"><span class="ico">✅</span>Todo</button>
  <button class="tb" onclick="go('conv',this)"><span class="ico">📐</span>変換</button>
  <button class="tb" onclick="go('timer',this)"><span class="ico">⏱</span>タイマー</button>
</nav>

<!-- CLOCK -->
<div id="pn-clock" class="pn on">
  <div class="clk-t" id="clk-t">00:00:00</div>
  <div class="clk-d" id="clk-d"></div>
  <div class="clk-w" id="clk-w"></div>
</div>

<!-- CALCULATOR -->
<div id="pn-calc" class="pn">
  <div class="cs">
    <div class="cs-ex" id="cs-ex"></div>
    <div class="cs-v" id="cs-v">0</div>
  </div>
  <div class="cg">
    <button class="cb fn" onclick="cAC()">AC</button>
    <button class="cb fn" onclick="cPM()">+/−</button>
    <button class="cb fn" onclick="cPct()">%</button>
    <button class="cb op" onclick="cOp('÷')">÷</button>
    <button class="cb" onclick="cN('7')">7</button>
    <button class="cb" onclick="cN('8')">8</button>
    <button class="cb" onclick="cN('9')">9</button>
    <button class="cb op" onclick="cOp('×')">×</button>
    <button class="cb" onclick="cN('4')">4</button>
    <button class="cb" onclick="cN('5')">5</button>
    <button class="cb" onclick="cN('6')">6</button>
    <button class="cb op" onclick="cOp('−')">−</button>
    <button class="cb" onclick="cN('1')">1</button>
    <button class="cb" onclick="cN('2')">2</button>
    <button class="cb" onclick="cN('3')">3</button>
    <button class="cb op" onclick="cOp('+')">+</button>
    <button class="cb w2" onclick="cN('0')">0</button>
    <button class="cb" onclick="cDot()">.</button>
    <button class="cb eq" onclick="cEq()">=</button>
  </div>
</div>

<!-- TODO -->
<div id="pn-todo" class="pn">
  <div class="td-row">
    <input class="td-in" id="td-in" placeholder="タスクを入力..." onkeydown="if(event.key==='Enter')tdAdd()">
    <button class="td-add" onclick="tdAdd()">+</button>
  </div>
  <ul class="td-ul" id="td-ul"></ul>
</div>

<!-- CONVERTER -->
<div id="pn-conv" class="pn">
  <div class="cv-card">
    <div class="cv-ttl">長さ ／ m ↔ cm</div>
    <div class="cv-row">
      <input class="cv-inp" id="v-m" type="number" placeholder="0" oninput="cvt('m')">
      <span class="cv-unit">m</span><span class="cv-arr">⇄</span>
      <input class="cv-inp" id="v-cm" type="number" placeholder="0" oninput="cvt('cm')">
      <span class="cv-unit">cm</span>
    </div>
  </div>
  <div class="cv-card">
    <div class="cv-ttl">長さ ／ km ↔ m</div>
    <div class="cv-row">
      <input class="cv-inp" id="v-km" type="number" placeholder="0" oninput="cvt('km')">
      <span class="cv-unit">km</span><span class="cv-arr">⇄</span>
      <input class="cv-inp" id="v-m2" type="number" placeholder="0" oninput="cvt('m2')">
      <span class="cv-unit">m</span>
    </div>
  </div>
  <div class="cv-card">
    <div class="cv-ttl">重さ ／ kg ↔ g</div>
    <div class="cv-row">
      <input class="cv-inp" id="v-kg" type="number" placeholder="0" oninput="cvt('kg')">
      <span class="cv-unit">kg</span><span class="cv-arr">⇄</span>
      <input class="cv-inp" id="v-g" type="number" placeholder="0" oninput="cvt('g')">
      <span class="cv-unit">g</span>
    </div>
  </div>
  <div class="cv-card">
    <div class="cv-ttl">温度 ／ ℃ ↔ ℉</div>
    <div class="cv-row">
      <input class="cv-inp" id="v-c" type="number" placeholder="0" oninput="cvt('c')">
      <span class="cv-unit">℃</span><span class="cv-arr">⇄</span>
      <input class="cv-inp" id="v-f" type="number" placeholder="0" oninput="cvt('f')">
      <span class="cv-unit">℉</span>
    </div>
  </div>
</div>

<!-- TIMER -->
<div id="pn-timer" class="pn">
  <div class="tm-wr">
    <div class="tm-t" id="tm-t">00:00:00</div>
  </div>
  <div class="tm-ins">
    <div class="tm-grp"><span class="tm-lb">時間</span><input class="tm-ip" id="tm-h" type="number" min="0" max="99" value="0"></div>
    <div class="tm-grp"><span class="tm-lb">分</span><input class="tm-ip" id="tm-m" type="number" min="0" max="59" value="0"></div>
    <div class="tm-grp"><span class="tm-lb">秒</span><input class="tm-ip" id="tm-s" type="number" min="0" max="59" value="0"></div>
  </div>
  <div class="tm-ct">
    <button class="tm-btn tm-go" id="tm-gb" onclick="tmGo()">スタート</button>
    <button class="tm-btn tm-rs" onclick="tmReset()">リセット</button>
  </div>
</div>

<script>
// TABS
function go(id, btn) {
  document.querySelectorAll('.pn').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
  document.getElementById('pn-' + id).classList.add('on');
  btn.classList.add('on');
}

// CLOCK
const WD = ['日','月','火','水','木','金','土'];
function tick() {
  const n = new Date(), p = x => String(x).padStart(2,'0');
  document.getElementById('clk-t').textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  document.getElementById('clk-d').textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
  document.getElementById('clk-w').textContent = `（${WD[n.getDay()]}曜日）`;
}
tick(); setInterval(tick, 1000);

// CALCULATOR
let cVal='0', cPrv='', cOpr='', cFresh=true;
const cUpd = () => {
  document.getElementById('cs-v').textContent = cVal;
  document.getElementById('cs-ex').textContent = cPrv ? `${cPrv} ${cOpr}` : '';
};
function cN(n) {
  cVal = cFresh ? n : (cVal==='0' ? n : cVal.length<12 ? cVal+n : cVal);
  cFresh=false; cUpd();
}
function cDot() {
  if (cFresh) { cVal='0.'; cFresh=false; } else if (!cVal.includes('.')) cVal+='.';
  cUpd();
}
function cOp(o) {
  if (cPrv && !cFresh) cEq();
  cPrv=cVal; cOpr=o; cFresh=true; cUpd();
}
function cEq() {
  if (!cPrv||!cOpr) return;
  const a=parseFloat(cPrv), b=parseFloat(cVal);
  let r;
  switch(cOpr){
    case '+': r=a+b; break;
    case '−': r=a-b; break;
    case '×': r=a*b; break;
    case '÷': r=b?a/b:'エラー'; break;
  }
  cVal = typeof r==='number' ? String(parseFloat(r.toFixed(10))) : r;
  if (typeof r==='number' && cVal.length>14) cVal=parseFloat(r).toExponential(4);
  cPrv=''; cOpr=''; cFresh=true; cUpd();
}
function cAC() { cVal='0'; cPrv=''; cOpr=''; cFresh=true; cUpd(); }
function cPM() {
  if (cVal!=='0' && !cVal.includes('エラー'))
    { cVal=cVal.startsWith('-')?cVal.slice(1):'-'+cVal; cUpd(); }
}
function cPct() {
  if (!cVal.includes('エラー')) { cVal=String(parseFloat(cVal)/100); cUpd(); }
}

// TODO
let tdItems = JSON.parse(localStorage.getItem('td')||'[]');
const tdSave = () => localStorage.setItem('td', JSON.stringify(tdItems));
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tdRender() {
  const ul=document.getElementById('td-ul');
  ul.innerHTML='';
  tdItems.forEach((t,i) => {
    const li=document.createElement('li');
    li.className='td-li'+(t.d?' dn':'');
    li.innerHTML=`<div class="td-ck" onclick="tdTog(${i})">${t.d?'✓':''}</div>`
      +`<span class="td-tx" onclick="tdTog(${i})">${esc(t.tx)}</span>`
      +`<button class="td-dl" onclick="tdDel(${i})">✕</button>`;
    ul.appendChild(li);
  });
}
function tdAdd() {
  const inp=document.getElementById('td-in'), tx=inp.value.trim();
  if(!tx) return;
  tdItems.unshift({tx,d:false}); inp.value=''; tdSave(); tdRender();
}
function tdTog(i){ tdItems[i].d=!tdItems[i].d; tdSave(); tdRender(); }
function tdDel(i){ tdItems.splice(i,1); tdSave(); tdRender(); }
tdRender();

// CONVERTER
function cvt(src) {
  const g = id => document.getElementById('v-'+id);
  const v = parseFloat(g(src).value);
  const set = (id,val) => { g(id).value=isNaN(v)?'':val; };
  if(src==='m')  set('cm',(v*100).toFixed(2));
  if(src==='cm') set('m', (v/100).toFixed(4));
  if(src==='km') set('m2',(v*1000).toFixed(1));
  if(src==='m2') set('km',(v/1000).toFixed(5));
  if(src==='kg') set('g', (v*1000).toFixed(1));
  if(src==='g')  set('kg',(v/1000).toFixed(5));
  if(src==='c')  set('f', (v*9/5+32).toFixed(2));
  if(src==='f')  set('c', ((v-32)*5/9).toFixed(2));
}

// TIMER
let tmLeft=0, tmRun=false, tmIv=null;
const tmFmt = s=>[Math.floor(s/3600),Math.floor(s%3600/60),s%60]
  .map(x=>String(x).padStart(2,'0')).join(':');
function tmGo() {
  const gb=document.getElementById('tm-gb'), td=document.getElementById('tm-t');
  if (!tmRun) {
    if (!tmLeft) {
      tmLeft=(parseInt(document.getElementById('tm-h').value)||0)*3600
            +(parseInt(document.getElementById('tm-m').value)||0)*60
            +(parseInt(document.getElementById('tm-s').value)||0);
      if (!tmLeft) return;
    }
    tmRun=true; td.classList.remove('dn');
    gb.textContent='一時停止'; gb.className='tm-btn tm-pa';
    tmIv=setInterval(()=>{
      tmLeft--;
      td.textContent=tmFmt(tmLeft);
      if(tmLeft<=0){
        clearInterval(tmIv); tmRun=false; tmLeft=0;
        td.classList.add('dn');
        gb.textContent='スタート'; gb.className='tm-btn tm-go';
        beep();
      }
    },1000);
  } else {
    clearInterval(tmIv); tmRun=false;
    gb.textContent='再開'; gb.className='tm-btn tm-go';
  }
}
function tmReset(){
  clearInterval(tmIv); tmRun=false; tmLeft=0;
  const td=document.getElementById('tm-t');
  td.textContent='00:00:00'; td.classList.remove('dn');
  const gb=document.getElementById('tm-gb');
  gb.textContent='スタート'; gb.className='tm-btn tm-go';
}
function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; o.type='sine';
      g.gain.setValueAtTime(0.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.4);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.4);
    });
  }catch(e){}
}
</script>
</body>
</html>
